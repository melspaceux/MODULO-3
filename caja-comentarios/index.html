<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja de Comentarios Interactiva</title>
    <link rel="stylesheet" href="styles.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>Caja de Comentarios</h1>
            <p>Comparte tus pensamientos con nosotros</p>
        </header>

        <main>
            <form id="commentForm" class="comment-form">
                <div class="input-group">
                    <textarea id="commentInput" placeholder="Escribe un comentario..." required></textarea>
                </div>
                <button type="submit" id="addCommentBtn">Publicar Comentario</button>
            </form>

            <section class="comments-section">
                <h2>Comentarios Recientes</h2>
                <div id="commentsList" class="comments-list">

                    <p class="empty-msg">No hay comentarios aún. ¡Sé el primero en comentar!</p>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
