<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Generador de Contraseñas</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="contenedor">
        <h1>Generador de Contraseñas</h1>

        <div class="pantalla">
            <input type="text" id="txtPassword" readonly placeholder="Aquí saldrá tu clave">
            <button id="btnCopiar">Copiar</button>
        </div>

        <div class="config">
            <div class="opcion-largo">
                <label>Largo de la clave: <span id="numLargo">10</span></label>
                <input type="range" id="sliderLargo" min="6" max="20" value="10">
            </div>

            <div class="opciones">
                <label><input type="checkbox" id="checkMayus" checked> Incluir Mayúsculas</label>
                <label><input type="checkbox" id="checkMinus" checked> Incluir Minúsculas</label>
                <label><input type="checkbox" id="checkNum" checked> Incluir Números</label>
                <label><input type="checkbox" id="checkSimbolos"> Incluir Símbolos</label>
            </div>

            <div class="fuerza">
                <span>Fortaleza: </span>
                <span id="txtFuerza">Media</span>
            </div>

            <button id="btnGenerar">¡Generar Nueva Clave!</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
